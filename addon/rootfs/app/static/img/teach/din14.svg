<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11"><rect x="1" y="1" width="318" height="198" rx="12" fill="#f7f8fa" stroke="#d0d4da"/>
