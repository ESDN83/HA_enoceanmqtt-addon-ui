<text x="262" y="80" text-anchor="middle" fill="#555" font-weight="600">actuator</text>
<circle cx="262" cy="100" r="6" fill="#f1c40f" stroke="#a88a00"><animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/></circle>
<text x="262" y="138" text-anchor="middle" fill="#444">in learn mode</text>
<text x="160" y="24" text-anchor="middle" fill="#555" font-weight="600">The actuator learns the app's sender ID</text>
