name: Release

# Pushing a vX.Y.Z tag publishes the GitHub release. The notes come from
# .github/release-notes/<tag>.md: the first line is the release title, the
# rest is the body. This lets a session without a personal GitHub token cut a
# release with a plain `git push origin vX.Y.Z`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the stable version
        run: |
          want="v$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match addon/config.yaml ($want)"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing"
            exit 1
          fi
          title="$(head -n 1 "$notes")"
          tail -n +2 "$notes" | sed '1{/^$/d}' > "$RUNNER_TEMP/body.md"
          gh release create "$GITHUB_REF_NAME" --title "$title" \
            --notes-file "$RUNNER_TEMP/body.md" --verify-tag
