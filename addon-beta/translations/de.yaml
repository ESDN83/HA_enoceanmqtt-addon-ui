---
configuration:
  serial_port:
    name: Serieller Port
    description: Wähle dein EnOcean-USB-Gateway aus der Liste. Hier muss ein Gerät ausgewählt werden. Wenn du stattdessen per TCP (unten) verbindest, hat das Vorrang und diese Auswahl wird ignoriert, dann einfach ein beliebiges Gerät wählen.
  tcp_port:
    name: TCP-Port
    description: "Entfernte EnOcean-Verbindung über TCP (Format: tcp:host:port, z.B. tcp:192.168.1.118:8638). Hat Vorrang vor seriellem Port."
  log_level:
    name: Log-Level
    description: Ausführlichkeit der Log-Ausgaben.
  cache_device_states:
    name: Gerätezustände zwischenspeichern
    description: Letzte Gerätezustände speichern und nach Neustart wiederherstellen. Wichtig für Sensoren mit seltenen Updates (z.B. Kessel Staufix sendet nur alle 8-10 Stunden).
  gateway_diagnostics:
    name: Gateway-Diagnose
    description: >-
      Fügt ein Gerät "EnOcean Gateway" mit dem Zustand des Add-ons hinzu: ob der Transceiver verbunden ist, seine Base ID, wie viele Geräte konfiguriert sind, wann das letzte Telegramm kam, und die Sendewarteschlange (beschäftigt, wartende Kommandos, Dauer des letzten Schwungs). Standardmäßig aus, weil die meisten Installationen das nicht brauchen. Einschalten, wenn du den Gateway-Zustand in Home Assistant sehen willst, oder wenn eine Automation warten muss, bis das Add-on fertig gesendet hat, etwa wenn ein Skript Rolladen schließt und das nächste Lichter ausschaltet. Verlorene Kommandos sind kein Grund dafür, es geht so oder so nichts verloren. Beim Ausschalten werden die Entitäten wieder entfernt.
  mqtt:
    name: MQTT-Einstellungen
    description: MQTT-Broker-Konfiguration für die Home Assistant Integration.
  mqtt.discovery_prefix:
    name: Discovery-Präfix
    description: MQTT-Topic-Präfix für die automatische Erkennung durch Home Assistant (normalerweise 'homeassistant').
  mqtt.prefix:
    name: Topic-Präfix
    description: MQTT-Topic-Präfix für EnOcean-Geräte (z.B. 'enocean' erzeugt Topics wie enocean/gerät/state).
  mqtt.client_id:
    name: Client-ID
    description: Eindeutige MQTT-Client-Kennung für diese App.
