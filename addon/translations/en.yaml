---
configuration:
  serial_port:
    name: Serial Port
    description: Select your EnOcean USB gateway from the list. A device must be selected here. If you connect via TCP (below) instead, that takes priority and this selection is ignored, so pick any device.
  tcp_port:
    name: TCP Port
    description: "Remote EnOcean connection via TCP (format: tcp:host:port, e.g., tcp:192.168.1.118:8638). Takes priority over serial port when set."
  log_level:
    name: Log Level
    description: Application log verbosity level.
  cache_device_states:
    name: Cache Device States
    description: Persist and restore device states after restart. Essential for sensors that send infrequently (e.g., Kessel Staufix sends every 8-10 hours).
  gateway_diagnostics:
    name: Gateway Diagnostics
    description: >-
      Adds an "EnOcean Gateway" device with the add-on's own state: whether the transceiver is connected, its base ID, how many devices are configured, when the last telegram arrived, and the send queue (busy, commands pending, duration of the last burst). Off by default, because most installations never need it. Switch it on if you want to see the gateway state in Home Assistant, or if an automation has to wait until the add-on has finished sending, for example when one script closes covers and the next one turns off lights. Lost commands are not a reason to enable it, nothing is lost either way. Switching it off removes the entities again.
  mqtt:
    name: MQTT Settings
    description: MQTT broker configuration for Home Assistant integration.
  mqtt.discovery_prefix:
    name: Discovery Prefix
    description: MQTT topic prefix for Home Assistant auto-discovery (usually 'homeassistant').
  mqtt.prefix:
    name: Topic Prefix
    description: MQTT topic prefix for EnOcean devices (e.g., 'enocean' creates topics like enocean/device/state).
  mqtt.client_id:
    name: Client ID
    description: MQTT client identifier for this app.
