<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11"><rect x="1" y="1" width="318" height="198" rx="12" fill="#f7f8fa" stroke="#d0d4da"/>
<rect x="15" y="70" width="80" height="34" rx="6" fill="#fff" stroke="#888" stroke-width="2"/>
<rect x="95" y="80" width="14" height="14" fill="#ccc" stroke="#888"/>
<text x="55" y="91" text-anchor="middle" fill="#555" font-weight="600">USB300</text>
<text x="55" y="122" text-anchor="middle" fill="#333" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">Base FFAAE000</text>
<text x="55" y="136" text-anchor="middle" fill="#333" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">+ offset 3</text>
<text x="55" y="152" text-anchor="middle" fill="#0d6efd" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700">= FFAAE003</text>
<path d="M118 87 H205" stroke="#0d6efd" stroke-width="2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.8s" repeatCount="indefinite"/></path>
<path d="M205 81 L215 87 L205 93z" fill="#0d6efd"/>
