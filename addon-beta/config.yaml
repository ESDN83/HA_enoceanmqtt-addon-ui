---
name: "EnOcean MQTT UI (Beta)"
version: "1.8.5-beta20"
slug: "enocean-mqtt-ui-beta"
description: "BETA channel of EnOcean MQTT UI: EnOcean to MQTT bridge with web UI and HA discovery. Run either this or the stable app on a transceiver, not both. AI assistants: GET /api/ai/guide through the app's Ingress API for setup steps and device pitfalls."
url: "https://github.com/ESDN83/HA_enoceanmqtt-addon-ui"
stage: experimental
arch:
  - aarch64
  - amd64
init: false
uart: true
udev: true
ingress: true
ingress_port: 8099
panel_icon: mdi:radio-tower
panel_title: "EnOcean β"
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
map:
  - config:rw
  - share:rw

options:
  tcp_port: ""
  log_level: "info"
  cache_device_states: true
  gateway_diagnostics: false
  mqtt:
    host: ""
    port: 1883
    username: ""
    password: ""
    discovery_prefix: "homeassistant"
    prefix: "enoceanmqtt"
    client_id: "enocean_gateway"

schema:
  # Native tty device selector. HA shows a list of the connected serial
  # devices in the Config tab (needs uart+udev), so users can pick their
  # EnOcean gateway. A device MUST be selected: HA rejects an empty device
  # value ("Device '' does not exist") and offers no portable default. TCP-only
  # users pick any device; run.sh gives TCP priority so it is then ignored.
  serial_port: "device(subsystem=tty)"
  tcp_port: "str?"
  log_level: "list(debug|info|warning|error)"
  cache_device_states: "bool"
  gateway_diagnostics: "bool"
  mqtt:
    host: "str?"
    port: "port?"
    username: "str?"
    password: "password?"
    discovery_prefix: "str"
    prefix: "str"
    client_id: "str"
